<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JellyAI 客户前台登录</title>
    <link rel="icon" href="/assets/jelly-logo-mark.png" />
    <style>
      :root {
        color-scheme: light;
        --ink: #192235;
        --muted: #667085;
        --line: #d9e0ea;
        --brand: #2563eb;
        --brand-dark: #1d4ed8;
        --bg: #eef3f8;
        --panel: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(20, 184, 166, 0.12)),
          var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 24px 70px rgba(31, 41, 55, 0.12);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 26px;
        font-weight: 800;
        letter-spacing: 0;
      }
      .brand img {
        width: 34px;
        height: 34px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.6;
      }
      label {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
        font-size: 14px;
        font-weight: 650;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 13px;
        font: inherit;
        color: var(--ink);
        outline: none;
      }
      input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
      button:hover {
        background: var(--brand-dark);
      }
      button:disabled {
        cursor: wait;
        opacity: 0.68;
      }
      .hint,
      .error {
        margin-top: 14px;
        font-size: 13px;
      }
      .hint {
        color: var(--muted);
      }
      .error {
        display: none;
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/assets/jelly-logo-mark.png" alt="" />
        <span>JellyAI 客户前台</span>
      </div>
      <h1>登录客户工作台</h1>
      <p>前台和后台已拆成两个本地站点；这里用于客户侧五个核心模块演示。</p>
      <form id="login-form">
        <label>
          账号
          <input name="account" autocomplete="username" value="tenant@jellyai.local" required />
        </label>
        <label>
          密码
          <input name="password" type="password" autocomplete="current-password" value="ChangeMe123!" required />
        </label>
        <button type="submit">进入前台</button>
        <div class="error" id="login-error"></div>
        <div class="hint">后台管理员请使用 http://localhost:3000/login。</div>
      </form>
    </main>
    <script>
      const form = document.getElementById("login-form");
      const button = form.querySelector("button");
      const errorBox = document.getElementById("login-error");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.style.display = "none";
        button.disabled = true;
        try {
          const formData = new FormData(form);
          const response = await fetch("/api/auth/login", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              account: formData.get("account"),
              password: formData.get("password"),
            }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || "登录失败");
          if (payload.redirectTo && !payload.redirectTo.startsWith("/admin")) {
            window.location.href = payload.redirectTo;
            return;
          }
          window.location.href = "/?module=conversations";
        } catch (error) {
          errorBox.textContent = error.message || "登录失败";
          errorBox.style.display = "block";
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
